<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elkaartjes · binnenkort</title>
<meta name="description" content="Elkaartjes – verbondenheid na verlies. Een gesprekskaartspel van Anna De Vos. Binnenkort meer.">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#2C2C2A; --text:#D3D1C7; --muted:#888780; --line:#5F5E5A; --o:#EF9F27; --b:#378ADD; --p:#D4537E;
          --ease:cubic-bezier(.22,.8,.24,1); }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    background:var(--bg); color:var(--text);
    font-family:'Poppins', system-ui, sans-serif; font-weight:300;
    min-height:100vh; min-height:100svh; display:flex; align-items:center; justify-content:center;
    padding:2rem;
  }
  @media (max-height: 640px) {
    .logo { width:90px; margin-bottom:1.4rem; }
    .soon { margin-top:2rem; }
    .bar { margin-top:1.6rem; }
  }
  @media (max-height: 520px) {
    body { padding:1.2rem 2rem; }
    .logo { width:70px; margin-bottom:1rem; }
    h1 { font-size:2.2rem; }
    .soon { margin-top:1.4rem; }
    .contact { margin-top:1rem; }
    .bar { margin-top:1.2rem; }
  }
  main { width:100%; max-width:360px; display:flex; flex-direction:column; align-items:flex-start; }
  .logo { width:110px; height:auto; margin-bottom:2rem; overflow:visible; }
  h1 { font-weight:500; font-size:clamp(2.4rem, 9vw, 3.2rem); line-height:1.1; }
  .sub { margin-top:.6rem; color:var(--muted); font-size:1rem; letter-spacing:.04em; }
  .soon { margin-top:3rem; font-size:.78rem; letter-spacing:.3em; text-transform:uppercase; color:var(--text); font-weight:400; }
  .author { margin-top:.6rem; color:var(--muted); font-size:.9rem; }
  .contact { margin-top:1.4rem; color:var(--text); font-size:.9rem; text-decoration:none; border-bottom:1px solid var(--line); padding-bottom:2px; transition:color .2s, border-color .2s; }
  .contact:hover { color:var(--o); border-color:var(--o); }
  .bar { display:flex; gap:4px; width:100%; height:5px; margin-top:2.2rem; }
  .bar span { flex:1; border-radius:3px; }

  /* ── Animatie ─────────────────────────────── */
  /* 1. de twee kaartjes schuiven naar elkaar toe */
  .card { transform-box:fill-box; transform-origin:center; }
  .card-o { animation:slideO 1.6s var(--ease) .2s both; }
  .card-p { animation:slideP 1.6s var(--ease) .2s both; }
  @keyframes slideO { from { transform:translate(-22px,-18px) rotate(-6deg); opacity:0; } 40% { opacity:1; } to { transform:none; opacity:1; } }
  @keyframes slideP { from { transform:translate(22px,18px) rotate(6deg); opacity:0; } 40% { opacity:1; } to { transform:none; opacity:1; } }

  /* 2. de tekst komt rustig na elkaar tevoorschijn */
  .fade { animation:fadeUp .9s var(--ease) both; }
  h1.fade       { animation-delay:1.1s; }
  .sub.fade     { animation-delay:1.3s; }
  .soon.fade    { animation-delay:1.6s; }
  .author.fade  { animation-delay:1.75s; }
  .contact.fade { animation-delay:1.9s; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }

  /* 3. de kleurenbalk groeit van links naar rechts */
  .bar span { transform-origin:left; animation:grow .7s var(--ease) both; }
  .bar span:nth-child(1) { animation-delay:2.05s; }
  .bar span:nth-child(2) { animation-delay:2.2s; }
  .bar span:nth-child(3) { animation-delay:2.35s; }
  @keyframes grow { from { transform:scaleX(0); } to { transform:scaleX(1); } }

  /* wie minder beweging wil, krijgt meteen de eindtoestand */
  @media (prefers-reduced-motion: reduce) {
    .card, .fade, .bar span { animation:none !important; }
  }
</style>
</head>
<body>
<main>
  <svg class="logo" viewBox="281.46 123.88 65.38 76.88" role="img" aria-label="Elkaartjes logo">
    <rect class="card card-o" x="282.21" y="124.63" width="38.33" height="49" rx="5.37" fill="#EF9F27" fill-opacity="0.2" stroke="#EF9F27" stroke-width="1.5"/>
    <rect class="card card-p" x="307.76" y="151.01" width="38.33" height="49" rx="5.37" fill="#D4537E" fill-opacity="0.2" stroke="#D4537E" stroke-width="1.5"/>
  </svg>
  <h1 class="fade">Elkaartjes</h1>
  <p class="sub fade">verbondenheid na verlies</p>
  <p class="soon fade">Binnenkort</p>
  <p class="author fade">Anna De Vos</p>
  <a class="contact fade" href="mailto:anna@elkaartjes.be">Contact</a>
  <div class="bar" aria-hidden="true">
    <span style="background:var(--o)"></span>
    <span style="background:var(--b)"></span>
    <span style="background:var(--p)"></span>
  </div>
</main>
<script data-goatcounter="https://elkaartjes.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
